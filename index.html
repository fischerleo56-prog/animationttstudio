<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top Ancient Runes</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent!important}
canvas{display:block;background:transparent!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=c.height=innerHeight}
addEventListener("resize",resize);resize();

const runes=["ᚠ","ᚢ","ᚱ","ᛃ","ᛟ","ᛞ","ᛉ","ᛇ","ᛋ","✦"];
const cols=[];
for(let i=0;i<26;i++){
  cols.push({
    x:(i+0.5)*innerWidth/26,
    y:Math.random()*140,
    s:18+Math.random()*12,
    p:Math.random()*6.28
  });
}

let t=0;
(function loop(){
  requestAnimationFrame(loop);
  t+=0.015;

  // Transparenter Hintergrund statt schwarzer Fläche
  ctx.clearRect(0,0,c.width,c.height);

  const top=ctx.createLinearGradient(0,0,0,180);
  top.addColorStop(0,"rgba(255,255,255,0.03)");
  top.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=top;
  ctx.fillRect(0,0,c.width,180);

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  for(let i=0;i<cols.length;i++){
    const r=cols[i];
    const yy=r.y+Math.sin(t+r.p)*8;
    ctx.font=r.s+"px serif";
    ctx.fillStyle="rgba(220,220,220,0.16)";
    ctx.fillText(runes[i%runes.length],r.x,yy);
  }

  const sweep=((Math.sin(t*0.5)+1)/2)*c.width;
  const g=ctx.createLinearGradient(sweep-120,0,sweep+120,0);
  g.addColorStop(0,"rgba(255,255,255,0)");
  g.addColorStop(.5,"rgba(255,255,255,0.06)");
  g.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,c.width,170);

  // Schwarzes Fade entfernt, damit Alpha erhalten bleibt
})();
</script>
</body>
</html>
