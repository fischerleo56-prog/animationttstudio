<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top Ancient Runes</title>
<style>
html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:transparent;
}
canvas{
    display:block;
    background:transparent;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
addEventListener("resize",resize);resize();

const runes=["ᚠ","ᚢ","ᚱ","ᛃ","ᛟ","ᛞ","ᛉ","ᛇ","ᛋ","✦"];
const cols=[];
for(let i=0;i<26;i++){
  cols.push({
    x:(i+0.5)*innerWidth/26,
    y:Math.random()*140,
    s:18+Math.random()*12,
    p:Math.random()*6.28
  });
}

let t=0;
(function loop(){
  requestAnimationFrame(loop);
  t+=0.015;

  ctx.clearRect(0,0,c.width,c.height);

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  for(let i=0;i<cols.length;i++){
    const r=cols[i];
    const yy=r.y+Math.sin(t+r.p)*8;
    ctx.font=r.s+"px serif";
    ctx.fillStyle="rgba(220,220,220,0.16)";
    ctx.fillText(runes[i%runes.length],r.x,yy);
  }
})();
</script>
</body>
</html>
