<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top Eclipse Ring</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#030303}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
addEventListener("resize",resize);resize();
let t=0;
function draw(){
 requestAnimationFrame(draw);
 t+=0.002;
 ctx.fillStyle="#030303";
 ctx.fillRect(0,0,c.width,c.height);

 const cx=c.width/2, cy=120;
 const r=85;

 // glow
 let g=ctx.createRadialGradient(cx,cy,0,cx,cy,170);
 g.addColorStop(0,"rgba(255,255,255,0.08)");
 g.addColorStop(1,"rgba(255,255,255,0)");
 ctx.fillStyle=g;
 ctx.beginPath();ctx.arc(cx,cy,170,0,Math.PI*2);ctx.fill();

 // ring
 ctx.beginPath();
 ctx.arc(cx,cy,r,0,Math.PI*2);
 ctx.lineWidth=5;
 ctx.strokeStyle="rgba(255,255,255,0.18)";
 ctx.stroke();

 // rotating arc
 ctx.beginPath();
 ctx.arc(cx,cy,r,-Math.PI/3+t,Math.PI/7+t);
 ctx.lineWidth=7;
 ctx.strokeStyle="rgba(255,255,255,0.45)";
 ctx.stroke();

 // center
 ctx.beginPath();
 ctx.arc(cx,cy,r-18,0,Math.PI*2);
 ctx.fillStyle="#050505";
 ctx.fill();

 // subtle rays
 for(let i=0;i<10;i++){
   const a=i*Math.PI/5+t*0.15;
   ctx.beginPath();
   ctx.moveTo(cx+Math.cos(a)*(r+10),cy+Math.sin(a)*(r+10));
   ctx.lineTo(cx+Math.cos(a)*(r+40),cy+Math.sin(a)*(r+40));
   ctx.strokeStyle="rgba(255,255,255,0.05)";
   ctx.stroke();
 }

 // fade to bottom
 let fade=ctx.createLinearGradient(0,0,0,c.height);
 fade.addColorStop(0,"rgba(0,0,0,0)");
 fade.addColorStop(.35,"rgba(0,0,0,0.15)");
 fade.addColorStop(1,"rgba(0,0,0,0.75)");
 ctx.fillStyle=fade;
 ctx.fillRect(0,0,c.width,c.height);
}
draw();
</script>
</body></html>
